name: Atualizar resultados

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}       # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar resultados na NBC News
        run: python3 scripts/atualizar.py dados.json

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- dados.json; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git commit -m "Atualiza resultados"
          git push
